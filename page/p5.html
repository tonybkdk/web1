<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>
    <title>Document</title>
</head>
<body>

    <div id="sketch-container"></div>
    
    <script>
        let font;
        function preload(){
            font = loadFont('ArchivoBlack-Regular')
        }
        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('sketch-container')
            textFont(font);
            textSize(200);
            
        }

        function draw(){
            background(200);
            //text('HELLO',width/2-80, height/2+65);

            let hiArray = font.textToPoints('hi', width/2-80, height/2+65, 200, {sampleFactor: 0.1});

            for(let i =0; i< hiArray. length; i++){
                ellipse(hiArray[i].x, hiArray[i].y, 10, 10);
            }

            console.log(hiArray);
        }
    </script>

</body>
</html>
