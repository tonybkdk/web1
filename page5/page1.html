<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Tarot Divination</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="tarot-box">
      <h1>Digital Tarot Divination</h1>

      <p class="ritual-text">
        Close your eyes. Think of one question.  
        When you are ready, type it below and reveal your card.
      </p>

      <input 
        id="question-input" 
        type="text" 
        placeholder="What do you want to ask the cards?"
      />

      <button id="draw-btn">Reveal My Card</button>

      <div id="result-container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
